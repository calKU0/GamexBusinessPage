name: Build and Deploy to FTP

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore GamexBusinessPage.csproj
      
    - name: Build
      run: dotnet build GamexBusinessPage.csproj --configuration Release --no-restore
      
    - name: Publish
      run: dotnet publish GamexBusinessPage.csproj --configuration Release --no-build --output ./publish
      
    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ secrets.FTP_SERVER_DIR }}
        local-dir: ./publish/
        exclude: |
          **/Data/**
        # The sync state records what the server already has, so only changed
        # files are uploaded. Bump the name to force a full re-upload after a
        # change that leaves the server holding files the manifest no longer
        # describes - a mismatch truncates static asset responses.
        state-name: .ftp-deploy-sync-state-v2.json
        # Must stay false. Data/ is excluded from upload and lives only on the
        # server, where the admin panel writes it; a clean slate would erase it.
        dangerous-clean-slate: false
